version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repo_intelligence_postgres
    environment:
      POSTGRES_DB: repo_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repo_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
